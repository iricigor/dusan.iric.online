<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{metadata.title}}</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
            <span class="subject-badge">Dějepis</span>
            <h1>{{metadata.topic}}</h1>
            <span class="audience-badge">Pro žáky: {{metadata.target_audience}}</span>
        </div>
        <div class="nav-controls">
            <button id="theme-toggle" class="icon-btn" title="Přepnout režim">🌓</button>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-target="tab-original">Původní text</button>
            <button class="tab-btn" data-target="tab-learn">Učit se</button>
            <button class="tab-btn" data-target="tab-play">Hrát si</button>
        </nav>
    </header>

    <main class="container wide-container">
        <!-- TAB 1: PŮVODNÍ TEXT -->
        <section id="tab-original" class="tab-content active">
            <div class="card wide-card">
                <h2>Původní text</h2>
                <div id="original-text-container" class="formatted-text"></div>
            </div>
        </section>

        <!-- TAB 2: UČIT SE -->
        <section id="tab-learn" class="tab-content">
            <div class="grid-layout wide-grid">
                <div class="card">
                    <h2>Větný rozbor a vysvětlení</h2>
                    <div id="chunks-container"></div>
                </div>
                <div class="card">
                    <h2>Klíčové pojmy</h2>
                    <div id="keyterms-container" class="keyterms-list"></div>
                </div>
            </div>
        </section>

        <!-- TAB 3: HRÁT SI -->
        <section id="tab-play" class="tab-content">
            <div id="quiz-setup" class="card wide-card">
                <h2>Kvízová výzva</h2>
                <p>Zadej své jméno a vyber obtížnost kvízu:</p>
                <div class="form-group">
                    <label for="player-name">Jméno hráče:</label>
                    <input type="text" id="player-name" placeholder="např. Eliška" autocomplete="off">
                </div>
                <div class="difficulty-selection">
                    <button class="diff-btn easy" data-diff="Easy">🟢 Lehká (3 otázky)<br><small>1x Lehká, 1x Střední, 1x Těžká</small></button>
                    <button class="diff-btn medium" data-diff="Medium">🟡 Střední (5 otázek)<br><small>2x Lehká, 2x Střední, 1x Těžká</small></button>
                    <button class="diff-btn hard" data-diff="Hard">🔴 Těžká (10 otázek)<br><small>3x Lehká, 5x Střední, 2x Těžká</small></button>
                </div>
                <div id="leaderboard-preview" class="leaderboard-section">
                    <h3>Síň slávy</h3>
                    <div id="leaderboard-list"></div>
                </div>
            </div>

            <div id="quiz-gameplay" class="card wide-card hidden">
                <div class="quiz-header">
                    <span id="question-progress">Otázka 1 / 3</span>
                    <span id="score-display">Skóre: 0 b</span>
                </div>
                <div id="question-container">
                    <h3 id="question-text"></h3>
                    <div id="answers-container"></div>
                </div>
                <div id="quiz-feedback" class="feedback-msg hidden"></div>
            </div>

            <div id="quiz-results" class="card wide-card hidden">
                <h2>Výsledek kvízu</h2>
                <div id="result-summary"></div>
                <div id="result-grade-banner" class="grade-banner"></div>
                <button id="restart-quiz-btn" class="primary-btn">Zpět na výběr kvízu</button>
            </div>
        </section>
    </main>

    <!-- Definition Modal / Tooltip -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-body"></p>
            <button id="modal-close" class="secondary-btn">Zavřít</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
