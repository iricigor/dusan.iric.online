name: Deploy SWA

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
    paths:
      - "site/**"
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Build And Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/site"
          api_location: ""
          output_location: ""
      - name: Comment on single-file preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATIC_WEB_APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" | jq -s 'add')"
          file_count="$(jq '[.[] | select(.filename | startswith("site/")) | select(.status != "removed")] | length' <<< "$files")"
          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" | jq -s 'add')"
          comment_id="$(jq -r '.[] | select(.body | contains("<!-- single-file-preview -->")) | .id' <<< "$comments" | tail -n 1)"

          if [[ "$file_count" -eq 1 ]]; then
            if [[ -z "$STATIC_WEB_APP_URL" ]]; then
              echo "The deployment action did not provide a preview URL." >&2
              exit 1
            fi

            file_path="$(jq -r '[.[] | select(.filename | startswith("site/")) | select(.status != "removed")][0].filename | ltrimstr("site/")' <<< "$files")"
            encoded_path="$(python3 -c 'from urllib.parse import quote; import sys; print(quote(sys.argv[1], safe="/"))' "$file_path")"
            preview_url="${STATIC_WEB_APP_URL%/}/${encoded_path}"
            body="<!-- single-file-preview -->"$'\n'"[Open the changed file preview](${preview_url})"

            if [[ -n "$comment_id" ]]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f "body=${body}"
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f "body=${body}"
            fi
          elif [[ -n "$comment_id" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
          fi

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
