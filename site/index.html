<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b14">
    <title>Dušan Irić</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #090b14;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 30% 35%, #17172d 0, transparent 55%),
          radial-gradient(ellipse at 75% 70%, #0c2027 0, transparent 50%);
      }

      main {
        padding: 2rem 1rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 8rem);
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1.2;
        color: #d2d9ee;
        animation: breathe 6s ease-in-out infinite;
        transition: transform 400ms ease, text-shadow 400ms ease;
      }

      h1 span {
        background: linear-gradient(110deg, #d2d9ee, #9baace, #d2d9ee);
        background-size: 200% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      h1:hover {
        animation: none;
        opacity: 1;
        transform: translateY(-0.04em) scale(1.03);
        text-shadow: 0 0 24px #85dfff80, 0 0 70px #aa8fff50;
      }

      h1:hover span {
        background-image: linear-gradient(110deg, #f5f7ff, #85dfff, #c4a7ff, #f5f7ff);
        animation: shimmer 2s ease-in-out infinite alternate;
      }

      @keyframes breathe {
        0%, 100% {
          opacity: 0.65;
          text-shadow: 0 0 18px #9baace10;
        }
        50% {
          opacity: 0.85;
          text-shadow: 0 0 32px #9baace30;
        }
      }

      @keyframes shimmer {
        from { background-position: 0% 50%; }
        to { background-position: 100% 50%; }
      }

      @media (prefers-reduced-motion: reduce) {
        h1, h1:hover span {
          animation: none;
        }

        h1 {
          opacity: 0.85;
          transition: none;
        }

        h1:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>Dušan Irić</span></h1>
    </main>
  </body>
</html>
