<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Od defenestrace k Bílé hoře</title>
    <style>:root {
    color-scheme: light;
    --bg: #f1f5f9; --card: #fff; --text: #172033; --muted: #475569;
    --primary: #174cb5; --border: #cbd5e1; --good: #146b3a; --bad: #b42318;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #101827; --card: #1c293c; --text: #f1f5f9; --muted: #cbd5e1;
        --primary: #9fc1ff; --border: #52657e; --good: #75e2a2; --bad: #ffaaa1;
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101827; --card: #1c293c; --text: #f1f5f9; --muted: #cbd5e1;
    --primary: #9fc1ff; --border: #52657e; --good: #75e2a2; --bad: #ffaaa1;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 1.1rem/1.7 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--card); padding: 1rem max(1rem, calc((100% - 1100px) / 2)); border-bottom: 1px solid var(--border); }
.heading { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
h1 { font-size: clamp(1.15rem, 3vw, 1.8rem); line-height: 1.3; margin: .4rem 0; }
h2 { font-size: 1.3rem; line-height: 1.4; }
header p { margin: .3rem 0; font-size: .9rem; color: var(--muted); }
.badge { color: var(--primary); font-weight: bold; }
nav, .modes { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
button, input { font: inherit; }
button { cursor: pointer; border: 1px solid var(--border); border-radius: .6rem; padding: .6rem .9rem; background: var(--card); color: var(--text); }
button:hover, button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; overflow-wrap: anywhere; }
.original-text { white-space: pre-wrap; }
.term, .correction { display: inline; padding: 0; border: 0; border-radius: 0; font: inherit; color: var(--primary); text-decoration: underline dotted; text-underline-offset: .2em; }
.correction { color: var(--bad); white-space: pre-wrap; text-align: left; }
#glossary { display: flex; flex-wrap: wrap; gap: .5rem; }
details { border-left: 3px solid var(--primary); padding: .5rem 1rem; margin-top: 1rem; }
summary { cursor: pointer; color: var(--primary); }
label { display: block; }
input[type="text"] { width: 100%; max-width: 35rem; border: 1px solid var(--border); border-radius: .5rem; padding: .75rem; background: var(--bg); color: var(--text); }
.modes > button { flex: 1 1 12rem; }
#answers { display: grid; gap: .75rem; }
#answers button { text-align: left; }
#feedback { padding: 1rem; margin: 1rem 0; border: 2px solid var(--border); border-radius: .6rem; }
.correct { color: var(--good); }
.incorrect, #name-error, #storage-warning { color: var(--bad); }
.grade { font-size: 1.4rem; font-weight: bold; }
#summary li { margin-bottom: 1rem; }
#summary p { margin: .25rem 0; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; border-bottom: 1px solid var(--border); padding: .5rem; white-space: nowrap; }
tr.current { background: var(--bg); font-weight: bold; outline: 2px solid var(--primary); outline-offset: -2px; }
dialog { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 1rem; max-width: min(90vw, 38rem); padding: 1.5rem; }
dialog::backdrop { background: #0009; }
a { color: var(--primary); }
[hidden] { display: none !important; }
@keyframes pop { 50% { transform: scale(1.015); } }
@keyframes shake { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
.success { animation: pop .3s ease; }
.failure { animation: shake .3s ease; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@media (max-width: 550px) {
    body { font-size: 1rem; }
    header { padding: .5rem .75rem; }
    .heading { align-items: flex-start; }
    #theme { font-size: .8rem; padding: .4rem; flex-shrink: 0; }
    .card { padding: 1rem; }
    nav button { flex: 1; padding: .4rem .2rem; font-size: .9rem; }
}
</style>
</head>
<body>
    <header>
        <div class="heading">
            <div><span class="badge">Dějepis</span><h1 id="topic"></h1></div>
            <button id="theme" type="button" aria-label="Přepnout světlý nebo tmavý režim">Světlý / tmavý</button>
        </div>
        <p id="audience"></p>
        <nav aria-label="Části lekce">

    <main>
        <noscript>Pro interaktivní lekci zapni JavaScript v prohlížeči.</noscript>

            <div id="original-content"></div>

        <section id="learning" aria-label="Učit se" hidden>
            <div id="chunks"></div>
            <article class="card"><h2>Slovníček</h2><div id="glossary"></div></article>
        </section>
        <section id="quiz" aria-label="Hrát si" hidden>
            <div id="setup" class="card">
                <h2>Kvízová výzva</h2>

                <input id="player" type="text" autocomplete="given-name" maxlength="60" placeholder="Tvoje jméno" aria-describedby="name-error">
                <p id="name-error" role="alert"></p>
                <p>Za zcela správnou odpověď za méně než 15 sekund získáš 2× body. Potom můžeš dál odpovídat za základní body.</p>
                <p>Otázky: lehká 10 b, střední 20 b, těžká 30 b. Známka nezávisí na rychlosti.</p>
                <div class="modes">
                    <button type="button" data-mode="easy">Lehká: 3 otázky (1 + 1 + 1)</button>
                    <button type="button" data-mode="medium">Střední: 5 otázek (1 + 2 + 2)</button>
                    <button type="button" data-mode="hard">Těžká: 10 otázek (2 + 5 + 3)</button>
                </div>
            </div>
            <article id="game" class="card" hidden>
                <p id="progress"></p>
                <p id="bonus" role="status"></p>
                <h2 id="question" tabindex="-1"></h2>
                <form id="answers"></form>
                <div id="feedback" role="status" hidden></div>
                <button id="next" type="button" hidden>Další otázka</button>
            </article>
            <article id="results" class="card" hidden>
                <h2 tabindex="-1" id="results-title">Jak se ti dařilo?</h2>
                <ol id="summary"></ol>
                <p id="grade" class="grade"></p>
                <button id="restart" type="button">Zkusit znovu</button>
            </article>
            <article id="leaderboard" class="card">
                <h2>Síň slávy</h2>
                <div id="leaderboard-content" class="table-scroll"></div>
            </article>
        </section>
    </main>
    <dialog id="definition" aria-labelledby="definition-title">
        <h2 id="definition-title"></h2>
        <p id="definition-text"></p>
        <form method="dialog"><button>Zavřít</button></form>
    </dialog>
    <script id="lesson-data" type="application/json">{"version":1,"id":"defenestrace-a-bila-hora","topic":"Od defenestrace k Bílé hoře","audience":"Pro desetileté děti, které se učí česky","review":"Toto je krátká ukázková lekce, ne celá kapitola. Původní text tvoří nezměněné úryvky z existující ukázky v gems. Opravujeme původ slova defenestrace: pochází z latiny, ne z němčiny. Rok 1618 je doplněn podle uvedených zdrojů. Datum bitvy na Bílé hoře 8. listopadu 1620 odpovídá uvedenému přehledu bitvy. Zdroje jsou encyklopedické přehledy; před použitím ve škole doporučujeme kontrolu učitelem.","sources":[{"title":"Defenestrace — původ slova z latiny","url":"https://cs.wikipedia.org/wiki/Defenestrace"},{"title":"Pražská defenestrace (1618) — začátek povstání","url":"https://cs.wikipedia.org/wiki/Pra%C5%BEsk%C3%A1_defenestrace_(1618)"},{"title":"Bitva na Bílé hoře — datum bitvy","url":"https://cs.wikipedia.org/wiki/Bitva_na_B%C3%ADl%C3%A9_ho%C5%99e"}],"original":[{"heading":"STAVOVSKÉ POVSTÁNÍ","text":"Pražskou defenestrací byla zahájena otevřená vzpoura proti panovníkovi a začalo stavovské povstání. Stavy požadovaly rovnoprávné postavení českých zemí v habsburské monarchii, možnost volby krále a svobodu náboženského vyznání."},{"heading":"BITVA NA BÍLÉ HOŘE — úryvek","text":"České stavy si zvolily za svého krále Fridricha Falckého. K rozhodujícímu střetnutí došlo 8. listopadu 1620 na Bílé hoře."},{"heading":"VÍŠ, ŽE...? — úryvek","text":"- Fenster znamená německy okno. Odtud pochází výraz defenestrace – vyhození z okna."}],"corrections":[{"section":2,"quote":"Odtud pochází výraz defenestrace – vyhození z okna.","explanation":"Fenster opravdu znamená německy okno. Slovo defenestrace ale pochází z latiny, ne z němčiny. Latinské fenestra znamená okno.","sourceUrl":"https://cs.wikipedia.org/wiki/Defenestrace"}],"glossary":[{"term":"defenestrace","forms":["defenestrací"],"definition":"Vyhození člověka nebo věci z okna. Slovo pochází z latiny. Pražská událost roku 1618 pomohla odstartovat povstání."},{"term":"stavy","forms":["stavů"],"definition":"Skupiny lidí s politickými právy, například šlechta a zástupci některých měst. Nešlo o všechny obyvatele země."},{"term":"monarchie","forms":["monarchii"],"definition":"Stát, kterému vládne panovník, například král nebo císař."},{"term":"náboženská svoboda","forms":["náboženskou svobodu"],"definition":"Možnost vyznávat svou víru. Spory o toto právo byly jednou z příčin povstání."},{"term":"Fridrich Falcký","forms":["Fridricha Falckého"],"definition":"Panovník, kterého si české stavy zvolily za krále."},{"term":"Bílá hora","forms":["Bílé hoře"],"definition":"Místo u Prahy, kde se 8. listopadu 1620 odehrála důležitá bitva."},{"term":"1618","forms":[],"definition":"Rok pražské defenestrace, kterou začalo stavovské povstání."},{"term":"1620","forms":[],"definition":"Rok bitvy na Bílé hoře."},{"term":"Fenster","forms":[],"definition":"Německé slovo pro okno. Nezaměňuj ho s latinským slovem fenestra."}],"chunks":[{"heading":"Proč začalo povstání?","sentences":["Pražská defenestrace roku 1618 zahájila otevřenou vzpouru proti panovníkovi.","Tím začalo stavovské povstání.","České stavy chtěly rovnoprávné postavení českých zemí v habsburské monarchii.","Chtěly také možnost volit krále a náboženskou svobodu."],"explanation":"Některé skupiny obyvatel se postavily proti vládci. Chtěly více rozhodovat o své zemi a mít svobodu ve víře. Nešlo o volby pro všechny lidi jako dnes."},{"heading":"Volba krále a důležitá bitva","sentences":["České stavy si zvolily za krále Fridricha Falckého.","Důležitá bitva se odehrála 8. listopadu 1620 na Bílé hoře u Prahy."],"explanation":"Stavy si vybraly vlastního krále. Potom přišla důležitá bitva. Pamatuj si místo Bílá hora a rok 1620."},{"heading":"Co znamená defenestrace?","sentences":["Defenestrace znamená vyhození z okna.","Slovo pochází z latiny: fenestra znamená okno.","Také německé slovo Fenster znamená okno, ale výraz defenestrace nevznikl z němčiny."],"explanation":"Různé jazyky mohou mít podobná slova. Tady je důležité rozlišit latinu a němčinu. Původní text se v původu slova mýlí."}],"questions":[{"id":"e-vzpoura","difficulty":"easy","type":"trueFalse","prompt":"Stavovské povstání bylo vzpourou proti panovníkovi.","options":["Pravda","Nepravda"],"answer":0,"explanation":"Stavy se otevřeně postavily proti panovníkovi."},{"id":"e-volba","difficulty":"easy","type":"trueFalse","prompt":"Král byl ve stavovské volbě vybírán všemi obyvateli země jako v dnešních volbách.","options":["Pravda","Nepravda"],"answer":1,"explanation":"Rozhodovaly stavy s politickými právy, ne všichni obyvatelé."},{"id":"m-vira","difficulty":"medium","type":"choice","prompt":"Co stavy požadovaly v otázce víry?","options":["Náboženskou svobodu","Zákaz všech náboženství","Povinnou změnu jazyka","Zrušení všech měst"],"answer":0,"explanation":"Jedním z požadavků byla svoboda náboženského vyznání."},{"id":"m-vyznam","difficulty":"medium","type":"choice","prompt":"Co znamená slovo defenestrace?","options":["Volba krále","Vyhození z okna","Uzavření míru","Placení daní"],"answer":1,"explanation":"Defenestrace označuje vyhození člověka nebo věci z okna."},{"id":"m-kral","difficulty":"medium","type":"choice","prompt":"Koho si české stavy zvolily za krále?","options":["Karla IV.","Rudolfa II.","Fridricha Falckého","Jana Husa"],"answer":2,"explanation":"V původním textu i ve vysvětlení najdeš Fridricha Falckého."},{"id":"m-jazyk","difficulty":"medium","type":"choice","prompt":"Z jakého jazyka pochází slovo defenestrace?","options":["Z češtiny","Z němčiny","Z francouzštiny","Z latiny"],"answer":3,"explanation":"Původ je latinský. Německé Fenster je jen podobné slovo pro okno."},{"id":"m-misto","difficulty":"medium","type":"choice","prompt":"Kde se odehrála důležitá bitva uvedená v lekci?","options":["Na Bílé hoře u Prahy","U moře","V Brně","V Paříži"],"answer":0,"explanation":"Bitva se odehrála na Bílé hoře u Prahy."},{"id":"h-defenestrace","difficulty":"hard","type":"text","prompt":"Ve kterém roce začalo stavovské povstání pražskou defenestrací? Napiš rok.","acceptedAnswers":["1618"],"year":true,"explanation":"Tato pražská defenestrace se odehrála roku 1618."},{"id":"h-bitva","difficulty":"hard","type":"text","prompt":"Ve kterém roce se odehrála bitva na Bílé hoře? Napiš rok.","acceptedAnswers":["1620"],"year":true,"explanation":"Bitva se odehrála 8. listopadu 1620."},{"id":"h-fenster","difficulty":"hard","type":"text","prompt":"Jak se německy řekne okno? Napiš jedno slovo z lekce.","acceptedAnswers":["Fenster"],"year":false,"explanation":"Německy je okno Fenster. Latinsky je to fenestra."}]}</script>
    <script>'use strict';

const MODES = { easy: [1, 1, 1], medium: [1, 2, 2], hard: [2, 5, 3] };
const POINTS = { easy: 10, medium: 20, hard: 30 };
const MODE_NAMES = { easy: 'Lehká', medium: 'Střední', hard: 'Těžká' };

function normalizeAnswer(value) {
    return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('cs').replace(/y/g, 'i').trim().replace(/\s+/g, ' ');
}

function shuffle(items, random = Math.random) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}

function selectQuestions(questions, mode, random = Math.random) {
    if (!Object.hasOwn(MODES, mode)) throw new Error(`Unknown quiz mode: ${mode}`);
    const selected = [];
    ['easy', 'medium', 'hard'].forEach((level, index) => {
        const pool = questions.filter(q => q.difficulty === level);
        const count = MODES[mode][index];
        if (pool.length < count) throw new Error(`Not enough ${level} questions`);
        if (mode === 'hard' && level === 'hard') {
            const years = pool.filter(q => q.year);
            if (!years.length) throw new Error('Hard mode needs a year question');
            const year = shuffle(years, random)[0];
            selected.push(year, ...shuffle(pool.filter(q => q.id !== year.id), random).slice(0, count - 1));
        } else {
            selected.push(...shuffle(pool, random).slice(0, count));
        }
    });
    return shuffle(selected, random);
}

function scoreAnswer(question, answer, elapsedMs) {
    let fraction = 0;
    if (question.type !== 'text') {
        fraction = answer === question.answer ? 1 : 0;
    } else if (question.year) {
        if (/^[0-9]{1,4}$/.test(answer.trim())) {
            const difference = Math.abs(Number(answer.trim()) - Number(question.acceptedAnswers[0]));
            fraction = difference === 0 ? 1 : difference < 10 ? 0.5 : 0;
        }
    } else {
        fraction = question.acceptedAnswers.some(expected => normalizeAnswer(expected) === normalizeAnswer(answer)) ? 1 : 0;
    }
    const base = POINTS[question.difficulty] * fraction;
    const bonus = fraction === 1 && elapsedMs >= 0 && elapsedMs < 15000 ? base : 0;
    return { fraction, base, bonus, total: base + bonus };
}

function grade(base, maximum) {
    const percentage = base / maximum;
    return percentage >= .8 ? 1 : percentage >= .6 ? 2 : percentage >= .4 ? 3 : percentage >= .2 ? 4 : 5;
}

function compareResults(a, b) {
    return b.total - a.total || a.duration - b.duration;
}

function initialize(lesson) {
    const $ = id => document.getElementById(id);
    const node = (tag, text, className) => {
        const result = document.createElement(tag);
        if (text !== undefined) result.textContent = text;
        if (className) result.className = className;
        return result;
    };
    const safeUrl = raw => {
        try {
            const parsed = new URL(String(raw), document.baseURI);
            return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : 'about:blank';
        } catch (_) {
            return 'about:blank';
        }
    };
    const button = (text, action, className) => {
        const result = node('button', text, className);
        result.type = 'button';
        result.addEventListener('click', action);
        return result;
    };
    const storageKey = `history-tutor:v1:${lesson.id}`;
    let quiz = null;
    let timer = null;
    let currentRunId = null;
    let records = [];
    const warnStorage = message => {
        $('storage-warning').textContent = message;
        $('storage-warning').hidden = false;
    };
    try {
        const stored = JSON.parse(sessionStorage.getItem(storageKey) || '[]');
        if (!Array.isArray(stored) || stored.some(row =>
            !row || typeof row.id !== 'string' || typeof row.name !== 'string' ||
            !Object.hasOwn(MODES, row.mode) || !Number.isFinite(row.total) || row.total < 0 ||
            !Number.isFinite(row.duration) || row.duration < 0 || !Number.isInteger(row.grade) ||
            row.grade < 1 || row.grade > 5 || typeof row.time !== 'string')) {
            throw new Error('Invalid leaderboard data');
        }
        records = stored;
    } catch (error) {
        console.warn('History tutor: cannot read session results.', error);
        warnStorage('Uložené výsledky nelze načíst. Nové výsledky se zatím zobrazí jen v této stránce.');
    }
    function definition(title, text) {
        $('definition-title').textContent = title;
        $('definition-text').textContent = text;
        $('definition').showModal();
    }
    const forms = new Map();
    lesson.glossary.forEach(entry => [entry.term, ...entry.forms].forEach(form => forms.set(form.toLocaleLowerCase('cs'), entry)));
    const escapeRegex = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const termPattern = new RegExp(`(?<![\\p{L}\\p{N}])(${[...forms.keys()].sort((a, b) => b.length - a.length).map(escapeRegex).join('|')})(?![\\p{L}\\p{N}])`, 'giu');
    function appendTerms(parent, text) {
        let offset = 0;
        for (const match of text.matchAll(termPattern)) {
            parent.append(document.createTextNode(text.slice(offset, match.index)));
            const entry = forms.get(match[0].toLocaleLowerCase('cs'));
            parent.append(button(match[0], () => definition(entry.term, entry.definition), 'term'));
            offset = match.index + match[0].length;
        }
        parent.append(document.createTextNode(text.slice(offset)));
    }
    $('topic').textContent = lesson.topic;
    $('audience').textContent = lesson.audience;
    $('review').textContent = lesson.review;
    lesson.sources.forEach(source => {
        const item = node('li');
        const link = node('a', source.title);
        link.href = safeUrl(source.url);
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        item.append(link);
        $('sources').append(item);
    });
    lesson.original.forEach((section, index) => {
        const article = node('article', undefined, 'card');
        article.append(node('h2', section.heading));
        const paragraph = node('p', undefined, 'original-text');
        const corrections = lesson.corrections.filter(c => c.section === index)
            .sort((a, b) => section.text.indexOf(a.quote) - section.text.indexOf(b.quote));
        let offset = 0;
        for (const correction of corrections) {
            const start = section.text.indexOf(correction.quote);
            paragraph.append(document.createTextNode(section.text.slice(offset, start)));
            const mark = button(correction.quote, () => definition('Historická oprava', correction.explanation), 'correction');
            mark.title = correction.explanation;
            paragraph.append(mark);
            offset = start + correction.quote.length;
        }
        paragraph.append(document.createTextNode(section.text.slice(offset)));
        article.append(paragraph);
        $('original-content').append(article);
    });
    lesson.chunks.forEach(chunk => {
        const article = node('article', undefined, 'card');
        article.append(node('h2', chunk.heading));
        const paragraph = node('p');
        appendTerms(paragraph, chunk.sentences.join(' '));
        const hint = node('details');
        hint.append(node('summary', 'Nápověda: jednodušeji'), node('p', chunk.explanation));
        article.append(paragraph, hint);
        $('chunks').append(article);
    });
    lesson.glossary.forEach(entry => $('glossary').append(button(entry.term, () => definition(entry.term, entry.definition))));
    document.querySelectorAll('[data-tab]').forEach(tab => tab.addEventListener('click', () => {
        document.querySelectorAll('[data-tab]').forEach(other => {
            const active = other === tab;
            other.setAttribute('aria-pressed', String(active));
            $(other.dataset.tab).hidden = !active;
        });
    }));
    $('theme').addEventListener('click', () => {
        const dark = document.documentElement.dataset.theme === 'dark' ||
            (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    });
    function renderLeaderboard() {
        const container = $('leaderboard-content');
        container.replaceChildren();
        if (!records.length) {
            container.append(node('p', 'Zatím žádné výsledky. Zkus první kvíz!'));
            return;
        }
        const table = node('table');
        const head = node('thead');
        const labels = node('tr');
        ['Hráč', 'Čas', 'Délka', 'Obtížnost', 'Body', 'Známka'].forEach(label => {
            const cell = node('th', label);
            cell.scope = 'col';
            labels.append(cell);
        });
        head.append(labels);
        const body = node('tbody');
        [...records].sort(compareResults).forEach(record => {
            const row = node('tr');
            if (record.id === currentRunId) {
                row.className = 'current';
                row.setAttribute('aria-current', 'true');
            }
            [record.name, record.time, `${record.duration} s`, MODE_NAMES[record.mode], `${record.total} b`, String(record.grade)]
                .forEach(value => row.append(node('td', value)));
            body.append(row);
        });
        table.append(head, body);
        container.append(table);
    }
    function finish() {
        clearInterval(timer);
        $('game').hidden = true;
        $('results').hidden = false;
        const base = quiz.answers.reduce((sum, answer) => sum + answer.score.base, 0);
        const bonus = quiz.answers.reduce((sum, answer) => sum + answer.score.bonus, 0);
        const maximum = quiz.questions.reduce((sum, question) => sum + POINTS[question.difficulty], 0);
        const mark = grade(base, maximum);
        $('summary').replaceChildren();
        quiz.answers.forEach(answer => {
            const item = node('li');
            item.append(node('strong', answer.question.prompt));
            const result = answer.score.fraction === 1 ? 'Správně' : answer.score.fraction > 0 ? 'Částečně správně' : 'Nesprávně';
            item.append(node('p', `${result}. Tvoje odpověď: ${answer.display}`, answer.score.fraction === 1 ? 'correct' : 'incorrect'));
            item.append(node('p', `Správná odpověď: ${answer.correct}`));
            item.append(node('p', `${answer.score.total} b${answer.score.bonus ? ` (bonus +${answer.score.bonus} b)` : ''}. ${answer.question.explanation}`));
            $('summary').append(item);
        });
        $('grade').textContent = `Body: ${base + bonus} (základ ${base}/${maximum}, bonus ${bonus}). Známka: ${mark}`;
        currentRunId = crypto.randomUUID();
        records.push({
            id: currentRunId, name: quiz.name, mode: quiz.mode, total: base + bonus,
            grade: mark, duration: Math.round((performance.now() - quiz.started) / 1000),
            time: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })
        });
        try {
            sessionStorage.setItem(storageKey, JSON.stringify(records));
        } catch (error) {
            console.warn('History tutor: cannot save session results.', error);
            warnStorage('Výsledky se nepodařilo uložit. Jsou vidět jen do obnovení této stránky.');
        }
        renderLeaderboard();
        $('leaderboard').hidden = false;
        $('results-title').focus();
    }
    function submit(answer) {
        if (quiz.locked) return;
        const question = quiz.questions[quiz.index];
        if (typeof answer === 'string' && !answer.trim()) {
            $('feedback').textContent = 'Nejdřív napiš odpověď.';
            $('feedback').hidden = false;
            return;
        }
        quiz.locked = true;
        clearInterval(timer);
        const score = scoreAnswer(question, answer, performance.now() - quiz.questionStarted);
        const correct = question.type === 'text' ? question.acceptedAnswers[0] : question.options[question.answer];
        const display = question.type === 'text' ? answer : question.options[answer];
        quiz.answers.push({ question, display, correct, score });
        $('answers').querySelectorAll('input, button').forEach(control => { control.disabled = true; });
        const label = score.fraction === 1 ? 'Správně!' : score.fraction > 0 ? 'Blízko! Máš polovinu bodů.' : 'Tentokrát ne. Zkus to příště!';
        $('feedback').textContent = `${label} Správná odpověď: ${correct}. ${question.explanation} Body: ${score.total}${score.bonus ? ` (bonus +${score.bonus})` : ''}.`;
        $('feedback').className = score.fraction > 0 ? 'correct success' : 'incorrect failure';
        $('feedback').hidden = false;
        $('next').textContent = quiz.index === quiz.questions.length - 1 ? 'Zobrazit výsledek' : 'Další otázka';
        $('next').hidden = false;
        $('next').focus();
    }
    function showQuestion() {
        clearInterval(timer);
        quiz.locked = false;
        const question = quiz.questions[quiz.index];
        $('progress').textContent = `Otázka ${quiz.index + 1} / ${quiz.questions.length} · ${POINTS[question.difficulty]} b`;
        $('question').textContent = question.prompt;
        $('feedback').hidden = true;
        $('next').hidden = true;
        $('answers').replaceChildren();
        if (question.type === 'text') {
            const label = node('label', 'Tvoje odpověď');
            label.htmlFor = 'answer-input';
            const input = node('input');
            input.id = 'answer-input';
            input.type = 'text';
            input.autocomplete = 'off';
            if (question.year) input.inputMode = 'numeric';
            const send = node('button', 'Odpovědět');
            send.type = 'submit';
            $('answers').append(label, input, send);
        } else {
            question.options.forEach((option, index) => $('answers').append(button(option, () => submit(index))));
        }
        quiz.questionStarted = performance.now();
        const update = () => {
            const remaining = Math.max(0, Math.ceil((15000 - (performance.now() - quiz.questionStarted)) / 1000));
            $('bonus').textContent = remaining ? `2× bonus: ${remaining} s` : 'Bonus skončil. Na odpověď máš stále čas.';
            if (!remaining) clearInterval(timer);
        };
        update();
        timer = setInterval(update, 1000);
        $('question').focus();
    }
    $('answers').addEventListener('submit', event => {
        event.preventDefault();
        if (quiz && !quiz.locked && $('answer-input')) submit($('answer-input').value);
    });
    document.querySelectorAll('[data-mode]').forEach(control => control.addEventListener('click', () => {
        const name = $('player').value.trim();
        if ((name.match(/\p{L}/gu) || []).length < 3) {
            $('name-error').textContent = 'Napiš jméno s alespoň třemi písmeny.';
            $('player').setAttribute('aria-invalid', 'true');
            $('player').focus();
            return;
        }
        $('name-error').textContent = '';
        $('player').removeAttribute('aria-invalid');
        quiz = {
            name, mode: control.dataset.mode,
            questions: selectQuestions(lesson.questions, control.dataset.mode),
            index: 0, answers: [], started: performance.now(), locked: false
        };
        $('setup').hidden = true;
        $('results').hidden = true;
        $('leaderboard').hidden = true;
        $('game').hidden = false;
        showQuestion();
    }));
    $('next').addEventListener('click', () => {
        if (!quiz.locked) return;
        quiz.index++;
        if (quiz.index === quiz.questions.length) finish();
        else showQuestion();
    });
    $('restart').addEventListener('click', () => {
        $('results').hidden = true;
        $('setup').hidden = false;
        $('player').focus();
    });
    renderLeaderboard();
}

if (typeof module !== 'undefined' && module.exports) {
    module.exports = { normalizeAnswer, shuffle, selectQuestions, scoreAnswer, grade, compareResults };
}
if (typeof document !== 'undefined') {
    initialize(JSON.parse(document.getElementById('lesson-data').textContent));
}
</script>
